<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Gift Boxes with Surprises</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: url('https://media.istockphoto.com/id/1356895797/de/vektor/weihnachtsmann-reitet-kinder-in-einem-magischen-schlitten.jpg?s=612x612&w=0&k=20&c=CgL6gQTH1qeFpudA-jOOBPaRur1o92Q6vCbrjfAd7L0=') no-repeat center center/cover;
            position: relative;
            overflow: hidden;
        }
        .snow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://cdn.pixabay.com/photo/2015/12/01/20/57/christmas-1070881_960_720.jpg') no-repeat center center/cover;
            z-index: -1;
            filter: blur(5px);
        }

        .snowflakes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .snowflakes div {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0.8;
            animation: snow 10s linear infinite;
        }

        @keyframes snow {
            to {
                transform: translateY(100vh);
            }
        }

        /* Thêm nhiều lớp tuyết với kích thước và tốc độ khác nhau */
        .snowflakes div:nth-child(1) {
            left: 10%;
            width: 12px;
            height: 12px;
            animation-duration: 10s;
            animation-delay: 0s;
        }
        .snowflakes div:nth-child(2) {
            left: 50%;
            width: 8px;
            height: 8px;
            animation-duration: 12s;
            animation-delay: 1s;
        }
        .snowflakes div:nth-child(3) {
            left: 30%;
            width: 10px;
            height: 10px;
            animation-duration: 8s;
            animation-delay: 2s;
        }
        .snowflakes div:nth-child(4) {
            left: 60%;
            width: 6px;
            height: 6px;
            animation-duration: 14s;
            animation-delay: 3s;
        }
        .snowflakes div:nth-child(5) {
            left: 80%;
            width: 14px;
            height: 14px;
            animation-duration: 9s;
            animation-delay: 4s;
        }
        .snowflakes div:nth-child(6) {
            left: 40%;
            width: 10px;
            height: 10px;
            animation-duration: 11s;
            animation-delay: 5s;
        }
        .snowflakes div:nth-child(7) {
            left: 20%;
            width: 16px;
            height: 16px;
            animation-duration: 15s;
            animation-delay: 6s;
        }
        .snowflakes div:nth-child(8) {
            left: 70%;
            width: 18px;
            height: 18px;
            animation-duration: 13s;
            animation-delay: 7s;
        }
        .snowflakes div:nth-child(9) {
            left: 90%;
            width: 12px;
            height: 12px;
            animation-duration: 17s;
            animation-delay: 8s;
        }
        .snowflakes div:nth-child(10) {
            left: 10%;
            width: 14px;
            height: 14px;
            animation-duration: 12s;
            animation-delay: 9s;
        }
        /* Thêm nhiều tuyết nữa */
        .snowflakes div:nth-child(11) {
            left: 15%;
            width: 18px;
            height: 18px;
            animation-duration: 16s;
            animation-delay: 10s;
        }
        .snowflakes div:nth-child(12) {
            left: 35%;
            width: 22px;
            height: 22px;
            animation-duration: 14s;
            animation-delay: 11s;
        }
        .snowflakes div:nth-child(13) {
            left: 55%;
            width: 10px;
            height: 10px;
            animation-duration: 18s;
            animation-delay: 12s;
        }
        .snowflakes div:nth-child(14) {
            left: 75%;
            width: 8px;
            height: 8px;
            animation-duration: 13s;
            animation-delay: 13s;
        }
        .snowflakes div:nth-child(15) {
            left: 45%;
            width: 16px;
            height: 16px;
            animation-duration: 20s;
            animation-delay: 14s;
        }
        .snowflakes div:nth-child(16) {
            left: 60%;
            width: 12px;
            height: 12px;
            animation-duration: 17s;
            animation-delay: 15s;
        }



        .merry-christmas {
            font-size: 4rem;
            font-family: 'Brush Script MT', cursive;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .gift-boxes {
            display: flex;
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        .gift-container {
            position: relative;
            width: 120px;
            height: 120px;
            cursor: pointer;
        }

        .gift-box {
            width: 100%;
            height: 100%;
            background: #ff4d4d;
            border: 5px solid #d63031;
            border-radius: 10px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .wreath {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/6/65/Christmas_Wreath.jpg');
            background-size: cover;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
            animation: wreathSpin 10s infinite linear;
        }
        .merry-christmas {
            font-size: 4rem;
            font-family: 'Brush Script MT', cursive;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: bounceIn 2s ease-out infinite alternate;
            margin-bottom: 50px;
            animation: sparkle 1s ease-in-out infinite;
        }

        .gift-lid {
            position: absolute;
            width: 100%;
            height: 30%;
            background: #ff6b6b;
            border: 5px solid #d63031;
            top: -30%;
            left: 0;
            border-radius: 10px 10px 0 0;
            transition: transform 0.5s ease;
            z-index: 2;
        }

        .gift-container:hover .gift-lid {
            transform: translateY(-30px) rotate(-10deg);
        }

        .gift-item {
            display: none; /* Ẩn món quà ban đầu */
            position: fixed; /* Hiển thị ở giữa màn hình */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0); /* Ẩn với scale nhỏ */
            animation: pop-up 0.5s forwards ease-out; /* Animation bật ra */
            z-index: 10;
            width: 150px;
            height: 150px;
        }

        @keyframes pop-up {
            from {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            background: #ffcc00;
            color: #333;
            font-weight: bold;
            border-radius: 5px;
            z-index: 5;
        }
        .santa-reindeer {
            position: absolute;
            top: 10%;
            left: -300px;
            animation: moveSanta 15s linear infinite;
            transform-style: preserve-3d;
            perspective: 1000px;
            z-index: 2;
        }

        .santa-reindeer img {
            width: 250px;
            height: auto;
            transform: rotateY(30deg) scale(1.1);
            transition: transform 0.5s ease-in-out;
        }

        @keyframes moveSanta {
            0% {
                left: -300px;
            }
            100% {
                left: 100%;
            }
        }

        /* Hiệu ứng 3D cho ông già Noel */
        .santa-reindeer {
            position: absolute;
            top: 10%;
            left: -300px;
            animation: moveSanta 15s linear infinite, bounceSanta 1s ease-in-out infinite, waveSanta 3s ease-in-out infinite;
            transform-style: preserve-3d;
            perspective: 1000px; /* Tạo chiều sâu 3D */
            z-index: 2;
        }

        .santa-reindeer img {
            width: 250px;
            height: auto;
            transform: rotateY(30deg) scale(1.1); /* Quay và phóng to ảnh */
            transition: transform 0.5s ease-in-out;
        }

        .santa-reindeer:hover img {
            transform: rotateY(0deg) scale(1.3); /* Hiệu ứng phóng to khi hover */
        }

        @keyframes moveSanta {
            0% {
                left: -300px; /* Bắt đầu từ ngoài màn hình bên trái */
            }
            100% {
                left: 100%; /* Đi qua màn hình từ trái sang phải */
            }
        }

        /* Hiệu ứng nhún nhảy (chân thật hơn) */
        @keyframes bounceSanta {
            0%, 100% {
                transform: rotateY(30deg) translateY(0);
            }
            50% {
                transform: rotateY(30deg) translateY(-10px); /* Đưa lên cao */
            }
        }

        /* Hiệu ứng vẫy tay */
        @keyframes waveSanta {
            0%, 100% {
                transform: rotateY(30deg) translateY(0) rotate(0deg);
            }
            50% {
                transform: rotateY(30deg) translateY(0) rotate(30deg); /* Vẫy tay */
            }
        }
        
    </style>
</head>
<body>
    <div class="merry-christmas">Merry Christmas!</div>
      <!-- Nền tuyết rơi -->
      <div class="snow"></div>

      <!-- Tuyết rơi -->
      <div class="snowflakes">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
      </div>
      <!-- Ông già Noel và tuần lộc -->
    <div class="santa-reindeer">
        <img src="2020-santa-sleigh-rudolph-clipart-removebg-preview (1).png" alt="Santa and Reindeer">
    </div>

    <div class="gift-boxes">
        <!-- Hộp 1 -->
        <div class="gift-container" onclick="showGift(0)">
            <div class="gift-box"></div>
            <div class="gift-lid"></div>
            <img src="https://th.bing.com/th/id/OIP.BiIsGQXm5-VPlZ2zH7MAkgAAAA?rs=1&pid=ImgDetMain" class="gift-item">
        </div>
        <!-- Hộp 2 -->
        <div class="gift-container" onclick="showGift(1)">
            <div class="gift-box"></div>
            <div class="gift-lid"></div>
            <img src="https://static.vecteezy.com/system/resources/previews/007/509/049/non_2x/closed-school-or-sports-backpack-in-doodle-style-with-zippered-pockets-and-a-water-bottle-pocket-briefcase-for-textbooks-black-white-illustration-hand-drawn-isolated-on-a-white-background-vector.jpg" class="gift-item">
        </div>
        <!-- Hộp 3 -->
        <div class="gift-container" onclick="showGift(2)">
            <div class="gift-box"></div>
            <div class="gift-lid"></div>
            <img src="https://png.pngtree.com/png-vector/20230803/ourlarge/pngtree-snow-pants-png-image_6882599.png" class="gift-item">
        </div>
        <!-- Hộp 4 -->
        <div class="gift-container" onclick="showGift(3)">
            <div class="gift-box"></div>
            <div class="gift-lid"></div>
            <img src="https://png.pngtree.com/png-clipart/20230913/original/pngtree-cash-clipart-cartoon-man-with-money-character-vector-illustration-png-image_11076780.png" class="gift-item">
        </div>
        <!-- Hộp 5 -->
        <div class="gift-container" onclick="showGift(4)">
            <div class="gift-box"></div>
            <div class="gift-lid"></div>
            <img src="https://img.lovepik.com/original_origin_pic/19/01/18/7c7cf55577e3d4a4e09b143ff0bc74c0.png_wh860.png" class="gift-item">
        </div>
    </div>

    <!-- Nút bật nhạc -->
    <button id="playButton">Play Merry Christmas Music</button>
    <audio id="music" loop>
        <source src="merry-christmas-270190.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <script>
        const openSound = new Audio('open-box-sound.mp3'); // Âm thanh mở hộp

        function showGift(index) {
            openSound.play(); // Phát âm thanh mở hộp
            const gifts = document.querySelectorAll('.gift-item');

            // Ẩn tất cả quà và xóa lớp hiệu ứng
            gifts.forEach(gift => {
                gift.style.display = 'none';
            });

            // Hiển thị món quà được chọn
            gifts[index].style.display = 'block';
        }

        const button = document.getElementById('playButton');
        const music = document.getElementById('music');

        button.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                button.textContent = "Pause Music";
            } else {
                music.pause();
                button.textContent = "Play Merry Christmas Music";
            }
        });
    </script>
</body>
</html>
